<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="title desc">
  <title id="title">Track loader illustration</title>
  <desc id="desc">Minimal line illustration of a compact track loader scooping earth, with a gently moving lift arm and bucket.</desc>
  <style>
    .line{fill:none;stroke:#899196;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
    .fine{fill:none;stroke:#a2a7a6;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
    .gold{fill:#f7e6c8;stroke:#e7a84f;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
    .glass{fill:#d8e9e8;stroke:#899196;stroke-width:4;stroke-linejoin:round}
    .arm{transform-box:view-box;transform-origin:346px 304px;animation:lift 4.8s ease-in-out infinite}
    .bucket{transform-box:view-box;transform-origin:520px 370px;animation:scoop 4.8s ease-in-out infinite}
    .tread{transform-box:view-box;transform-origin:390px 370px;animation:roll 4.8s ease-in-out infinite}
    .dust{transform-box:view-box;transform-origin:center;animation:dust 2.6s ease-out infinite}
    .dust.delay{animation-delay:1.3s}
    @keyframes lift{0%,100%{transform:rotate(0)}45%,66%{transform:rotate(-2.8deg)}}
    @keyframes scoop{0%,100%{transform:rotate(0)}45%,66%{transform:rotate(-5deg)}}
    @keyframes roll{0%,100%{transform:translateX(0)}45%,66%{transform:translateX(2px)}}
    @keyframes dust{0%{opacity:0;transform:translate(0,5px) scale(.65)}32%{opacity:.48}100%{opacity:0;transform:translate(-14px,-8px) scale(1.18)}}
    @media(prefers-reduced-motion:reduce){.arm,.bucket,.tread,.dust{animation:none}}
  </style>
  <path class="fine" d="M58 414H742M74 434h120m422 0h100" opacity=".75"/>
  <path d="M111 407q173-15 328 0t241-1" fill="none" stroke="#e7e2d3" stroke-width="9" stroke-linecap="round"/>
  <g aria-hidden="true">
    <g class="tread">
      <path d="M207 350q10-54 65-59h262q54 4 64 58l-18 44H226z" fill="#fbf7ec" stroke="#899196" stroke-width="5" stroke-linejoin="round"/>
      <path class="fine" d="M231 358h342m-330 20h320"/>
      <g fill="#fffdf6" stroke="#899196" stroke-width="3"><circle cx="255" cy="371" r="9"/><circle cx="306" cy="371" r="9"/><circle cx="357" cy="371" r="9"/><circle cx="408" cy="371" r="9"/><circle cx="459" cy="371" r="9"/><circle cx="510" cy="371" r="9"/><circle cx="557" cy="371" r="9"/></g>
    </g>
    <path class="gold" d="M269 301q18-64 73-69h75l38 40-4 91H272z"/>
    <path class="glass" d="m358 238 55 2 28 79h-91z"/>
    <path class="fine" d="m371 249 34 1 21 57h-55zM291 319h137"/>
    <circle cx="347" cy="307" r="10" fill="#e7a84f" stroke="#fffdf6" stroke-width="4"/>
    <g class="arm">
      <path class="gold" d="m333 302 36-21 91 49-10 26-96-28z"/>
      <path class="fine" d="m361 293 86 45"/>
      <circle cx="459" cy="344" r="8" fill="#e7a84f" stroke="#fffdf6" stroke-width="4"/>
    </g>
    <g class="bucket">
      <path d="m450 334 94 16 48 43-15 22-104-12-38-38z" fill="#f3e2c3" stroke="#899196" stroke-width="5" stroke-linejoin="round"/>
      <path class="fine" d="m453 372 118 13"/>
    </g>
    <g fill="#e7a84f" opacity=".6"><circle class="dust" cx="570" cy="410" r="7"/><circle class="dust delay" cx="588" cy="408" r="5"/></g>
  </g>
</svg>
